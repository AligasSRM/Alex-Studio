name: Docker runner integration
on:
  pull_request:
    paths:
      - '.github/workflows/docker-integration.yml'
      - 'lib/ai-command-runner.ts'
      - 'app/api/ai/iterate/route.ts'
      - 'tests/ai-command-runner.docker.test.ts'
      - 'tests/ai-iterate-sandbox.docker.test.ts'
      - 'docs/reviews/PHASE-3-SECURITY-AND-RUNNER-AUDIT-2026-10-29.md'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/docker-integration.yml'
      - 'lib/ai-command-runner.ts'
      - 'app/api/ai/iterate/route.ts'
      - 'tests/ai-command-runner.docker.test.ts'
      - 'tests/ai-iterate-sandbox.docker.test.ts'
      - 'docs/reviews/PHASE-3-SECURITY-AND-RUNNER-AUDIT-2026-10-29.md'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      runner_image:
        description: "Only the reviewed and approved Microsoft Playwright image digest is allowed (exact match)."
        required: false
        default: "mcr.microsoft.com/playwright:v1.56.1-noble@sha256:42f02d323c310069b4d54c94bd91a608966a486c3492c48ae0b1cea747ec5ca2"
        type: string

permissions:
  contents: read

concurrency:
  group: alex-studio-docker-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-integration:
    name: Real Docker runner integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate pinned runner image
        env:
          RUNNER_IMAGE: ${{ inputs.runner_image || 'mcr.microsoft.com/playwright:v1.56.1-noble@sha256:42f02d323c310069b4d54c94bd91a608966a486c3492c48ae0b1cea747ec5ca2' }}
        run: |
          APPROVED_RUNNER_IMAGE='mcr.microsoft.com/playwright:v1.56.1-noble@sha256:42f02d323c310069b4d54c94bd91a608966a486c3492c48ae0b1cea747ec5ca2'
          if [ "$RUNNER_IMAGE" != "$APPROVED_RUNNER_IMAGE" ]; then
            echo "::error::runner_image must exactly match the reviewed and approved image digest."
            exit 1
          fi
          printf 'Using pinned runner image: %s\n' "$RUNNER_IMAGE"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install dependencies and warm npm cache
        run: npm ci
        timeout-minutes: 8

      - name: Verify Docker daemon
        run: docker info

      - name: Run real Docker integration tests
        env:
          RUN_DOCKER_INTEGRATION: "1"
          AI_RUNNER_DOCKER_IMAGE: ${{ inputs.runner_image || 'mcr.microsoft.com/playwright:v1.56.1-noble@sha256:42f02d323c310069b4d54c94bd91a608966a486c3492c48ae0b1cea747ec5ca2' }}
          AI_RUNNER_NPM_CACHE: ${{ runner.temp }}/npm-cache
        run: |
          mkdir -p "$AI_RUNNER_NPM_CACHE"
          # Copy the trusted cache created by npm ci; integration fixtures have no external dependencies.
          npm_cache="$(npm config get cache)"
          if [ -d "$npm_cache" ]; then cp -a "$npm_cache/." "$AI_RUNNER_NPM_CACHE/"; fi
          npx jest tests/ai-command-runner.docker.test.ts tests/ai-iterate-sandbox.docker.test.ts --runInBand
        timeout-minutes: 8
