name: Windows runner safety gate
on:
  pull_request:
    paths:
      - '.github/workflows/windows-runner-gate.yml'
      - 'lib/ai-command-runner.ts'
      - 'lib/ai-build-server-preview.ts'
      - 'app/api/ai/iterate/route.ts'
      - 'tests/ai-command-runner.test.ts'
      - 'tests/ai-command-runner-timeout.test.ts'
      - 'tests/ai-command-runner.docker.test.ts'
      - 'tests/ai-iterate-sandbox.docker.test.ts'
      - 'tests/ai-build-server-preview.docker.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alex-studio-windows-runner-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-runner-gate:
    name: Windows-host fail-closed regression tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --prefer-online
        shell: bash
        timeout-minutes: 8

      - name: Verify no generated commands execute without Windows isolation
        run: npm test -- tests/ai-command-runner.test.ts tests/ai-command-runner-timeout.test.ts tests/ai-command-runner.docker.test.ts tests/ai-iterate-sandbox.docker.test.ts tests/ai-build-server-preview.docker.test.ts
        shell: bash
