name: Live AI provider proof
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/openai-provider-proof.yml'
      - 'app/api/ai/build/route.ts'
      - 'app/api/ai/generate/route.ts'
      - 'app/api/ai/iterate/route.ts'
      - 'tests/ai-build.live.integration.test.ts'
      - 'lib/ai-usage.ts'
      - 'lib/project-store.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alex-studio-live-ai-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-provider:
    name: Real Groq request through AI build route
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --prefer-online
        timeout-minutes: 8

      - name: Fail clearly if the Groq secret is missing
        if: ${{ env.GROQ_API_KEY == '' }}
        run: |
          echo 'GROQ_API_KEY repository secret is required for the live-provider proof.'
          exit 1

      - name: Exercise the real Groq provider through /api/ai/build
        env:
          RUN_REAL_AI_INTEGRATION: '1'
        run: npm test -- tests/ai-build.live.integration.test.ts
        timeout-minutes: 3
