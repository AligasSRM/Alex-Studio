name: Windows platform safety gate
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alex-studio-windows-platform-safety-gate
  cancel-in-progress: false

jobs:
  safety-gate:
    name: Windows-host runner fail-closed tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --prefer-online
        shell: bash
        timeout-minutes: 8

      - name: Verify generated code remains blocked without Windows isolation
        run: npm test -- tests/ai-command-runner.test.ts tests/ai-command-runner-timeout.test.ts tests/windows-command-runner-gate.test.ts tests/windows-browser-runner-gate.test.ts tests/windows-build-preview-gate.test.ts
        shell: bash
