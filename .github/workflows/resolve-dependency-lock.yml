name: Resolve dependency lockfile (temporary)
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/dependency-audit-*
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20
      - name: Resolve package lock without running lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
        timeout-minutes: 10
      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-lockfile-candidate
          path: package-lock.json
          retention-days: 2
