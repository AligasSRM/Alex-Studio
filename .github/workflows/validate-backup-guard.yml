name: Validate backup descriptor guard (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20
      - name: Resolve validation dependency lock
        run: |
          npm pkg set overrides.glob=14.0.2 overrides.minimatch=11.0.1
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const local = JSON.parse(fs.readFileSync('vendor/deepmerge/package.json', 'utf8'));
          lock.packages['vendor/deepmerge'] = { ...lock.packages['vendor/deepmerge'], name: local.name, version: local.version };
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + String.fromCharCode(10));
          NODE
      - name: Install exact dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --prefer-online
        timeout-minutes: 10
      - name: Dependency audit
        run: |
          npm audit --json > /tmp/audit.json || true
          node -e "const r=require('/tmp/audit.json'); const v=r.metadata?.vulnerabilities||{}; console.log(v); if(['critical','high','moderate'].some(k=>(v[k]||0)>0)) process.exit(1)"
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
        timeout-minutes: 10
