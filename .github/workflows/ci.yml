name: Alex Studio CI
on:
  pull_request:
    branches: [integration/security-hardening-2026-11-02, main]
  push:
    branches: [integration/security-hardening-2026-11-02, main, chore/android-personal-scope-cleanup-2026-11-04]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alex-studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Android-scope application checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Browser acceptance
        run: npm run test:e2e
