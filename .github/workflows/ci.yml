name: Alex Studio CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/alex-studio-implementation-2026-10-27, test/phase-0-acceptance-suite, fix/security-review-apply-gate-2026-10-27]
  workflow_dispatch:

# Keep the workflow token read-only. This CI does not need to push commits or open PRs.
permissions:
  contents: read

concurrency:
  group: alex-studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types, lint, build and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record exact tested commit
        run: echo "Testing commit $GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # Keep npm install until a committed lockfile is confirmed; npm ci requires one.
      - name: Install dependencies
        run: npm install
        timeout-minutes: 8

      - name: Install Playwright Chromium Headless Shell
        run: npx playwright install --with-deps --only-shell chromium
        timeout-minutes: 8

      - name: Verify installed Playwright Chromium
        run: npx playwright --version && node -e "const { chromium } = require('@playwright/test'); console.log(chromium.executablePath())"

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Run browser acceptance tests
        run: npm run test:e2e

      # Passing this workflow does not certify the isolated generated-code runner,
      # host storage quotas, container cleanup, or dependency provenance.
