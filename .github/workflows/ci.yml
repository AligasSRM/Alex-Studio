name: Alex Studio CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/alex-studio-implementation-2026-10-27, test/phase-0-acceptance-suite]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alex-studio-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Tests, types, lint, build and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Install Chromium for Playwright
        timeout-minutes: 8
        run: |
          npx playwright install-deps chromium
          npx playwright install --only-shell chromium
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Run browser acceptance tests
        run: npm run test:e2e
